<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GestionaPro</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0B1E3D;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #cargando {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0B1E3D;
    color: #F4F6FB;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(244,246,251,0.25);
    border-top-color: #FF5F3D;
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  #cargando p { font-size: 15px; color: #B9C4DC; margin: 0; }
</style>
</head>
<body>

<div id="cargando">
  <div class="spinner"></div>
  <p>Cargando GestionaPro...</p>
</div>

<!--
  ⚠️ PASO OBLIGATORIO ANTES DE PUBLICAR:
  Reemplaza la URL de abajo por tu URL real de /exec
  (la que usas hoy para entrar a la app desde script.google.com/macros/s/.../exec)

  Si más adelante haces una "New deployment" en Apps Script (en vez de "Edit deployment"
  sobre la misma), la URL cambia y hay que actualizarla aquí también.
-->
<iframe
  id="appFrame"
  src="https://script.google.com/macros/s/AKfycbyfRB3l-dY00ow-k-4neRrSdkMJvmKzEjn2Gy4FMLk25Ci91T4V7GZnYphVwzZLDqY8/exec"
  onload="document.getElementById('cargando').style.display='none';"
  allow="clipboard-write"
></iframe>

</body>
</html>
