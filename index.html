<a href="#" id="btnCambiarEscuela" onclick="cambiarEscuela(); return false;">¿No es tu escuela? Cambiar</a>

<script>
  // ⚠️ Reemplaza esto por la URL /exec real de tu proyecto "Directorio-GestionaPro" una vez
  // lo despliegues (Implementar -> Nueva implementación -> Aplicación web).
  var DIRECTORIO_URL = 'https://script.google.com/macros/s/AKfycbxDRAvJa6nmC2xgWklhMRIiI1gxRUc5vh9dSlz7eoWTzOZeJpkBJcka9ssnp_9-aJ8Wog/exec';

  var CLAVE_CODIGO = 'gp_codigo';
  var CLAVE_URL = 'gp_url';

  function mostrarPantallaCodigo(mensajeError) {
    document.getElementById('cargando').style.display = 'none';
    document.getElementById('appFrame').style.display = 'none';
    document.getElementById('btnCambiarEscuela').style.display = 'none';
    document.getElementById('pantallaCodigo').style.display = 'flex';
    document.getElementById('errorCodigo').innerText = mensajeError || '';
    document.getElementById('inputCodigo').focus();
  }

  function cargarApp(url) {
    var frame = document.getElementById('appFrame');
    frame.onload = function () {
      document.getElementById('cargando').style.display = 'none';
    };
    frame.src = url;
    frame.style.display = 'block';
    document.getElementById('pantallaCodigo').style.display = 'none';
    document.getElementById('btnCambiarEscuela').style.display = 'block';
  }

  function validarCodigo(codigo, esSilencioso) {
    fetch(DIRECTORIO_URL + '?codigo=' + encodeURIComponent(codigo))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok && data.url) {
          localStorage.setItem(CLAVE_CODIGO, codigo);
          localStorage.setItem(CLAVE_URL, data.url);
          cargarApp(data.url);
        } else {
          localStorage.removeItem(CLAVE_CODIGO);
          localStorage.removeItem(CLAVE_URL);
          mostrarPantallaCodigo(data.mensaje || 'Código no válido.');
        }
      })
      .catch(function () {
        if (esSilencioso) {
          // Sin internet o el Directorio no respondió: si ya había una URL guardada,
          // deja entrar con esa mientras se recupera la conexión, en vez de trabar al usuario.
          var urlGuardada = localStorage.getItem(CLAVE_URL);
          if (urlGuardada) { cargarApp(urlGuardada); return; }
        }
        mostrarPantallaCodigo('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
      });
  }

  function intentarEntrar() {
    var codigo = document.getElementById('inputCodigo').value.trim().toUpperCase();
    if (!codigo) {
      document.getElementById('errorCodigo').innerText = 'Escribe tu código de escuela.';
      return;
    }
    document.getElementById('btnEntrar').disabled = true;
    document.getElementById('errorCodigo').innerText = '';
    validarCodigo(codigo, false);
    document.getElementById('btnEntrar').disabled = false;
  }

  function cambiarEscuela() {
    localStorage.removeItem(CLAVE_CODIGO);
    localStorage.removeItem(CLAVE_URL);
    mostrarPantallaCodigo('');
  }

  document.getElementById('inputCodigo').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') intentarEntrar();
  });

  // Al cargar: si ya hay un código guardado en este dispositivo, revalida en segundo plano
  // (por si el administrador lo desactivó) y entra directo sin volver a preguntar.
  var codigoGuardado = localStorage.getItem(CLAVE_CODIGO);
  if (codigoGuardado) {
    validarCodigo(codigoGuardado, true);
  } else {
    mostrarPantallaCodigo('');
  }
</script>

</body>
</html>
