<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1E3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GestionaPro</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0B1E3D;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  iframe { width: 100%; height: 100%; border: none; display: block; }

  #cargando {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0B1E3D; color: #F4F6FB; z-index: 10;
  }
  .spinner {
    width: 44px; height: 44px; border: 4px solid rgba(244,246,251,0.25);
    border-top-color: #FF5F3D; border-radius: 50%;
    animation: girar 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  #cargando p { font-size: 15px; color: #B9C4DC; margin: 0; }

  #pantallaCodigo {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background-color: #05091a; padding: 0 24px 24px;
    color: #F4F6FB; text-align: center; z-index: 20;
  }
  .bannerWrap { position: relative; width: 100%; max-width: 380px; flex-shrink: 0; }
  .bannerWrap img { width: 100%; display: block; }
  .bannerWrap::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 15%;
    background: linear-gradient(to bottom, rgba(5,9,26,0), #05091a);
  }
  #pantallaCodigo h1 { font-size: 22px; margin: 0 0 6px 0; }
  #pantallaCodigo p.sub { font-size: 14px; color: #B9C4DC; margin: 8px 0 20px 0; }
  #inputCodigo {
    width: 100%; max-width: 280px; padding: 14px 16px; font-size: 16px;
    border: none; border-radius: 12px; text-align: center;
    text-transform: uppercase; margin-bottom: 12px; box-sizing: border-box;
  }
  #btnEntrar {
    width: 100%; max-width: 280px; padding: 14px; font-size: 16px; font-weight: bold;
    border: none; border-radius: 12px; background: #FF5F3D; color: #fff; cursor: pointer;
  }
  #btnEntrar:disabled { opacity: 0.6; }
  #errorCodigo { color: #FF8B7A; font-size: 13px; min-height: 18px; margin-top: 12px; }

  /* Botón "cambiar escuela": ahora es un ícono pequeño y discreto en la
     esquina SUPERIOR derecha (antes era una franja de texto fija abajo a la
     izquierda que quedaba montada sobre botones reales de la app del cliente). */
  #btnCambiarEscuela {
    position: fixed; top: 12px; right: 12px; z-index: 999999;
    width: 34px; height: 34px; display: none;
    align-items: center; justify-content: center;
    background: rgba(11,30,61,0.55); color: #F4F6FB; text-decoration: none;
    font-size: 16px; border-radius: 50%; line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
</style>
</head>

  <p class="sub">Escribe el código de acceso de tu escuela</p>
  <input type="text" id="inputCodigo" placeholder="CÓDIGO DE ESCUELA" autocapitalize="characters">
  <button id="btnEntrar" onclick="intentarEntrar()">Entrar</button>
  <div id="errorCodigo"></div>

  <div style="margin-top:26px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.15); width:100%; max-width:280px;">
    <p style="font-size:0.8rem; color:#B9C4DC; margin:0 0 10px 0;">¿No eres cliente todavía?</p>
    <a href="https://gestionapro.github.io/DEMO/" style="display:block; width:100%; padding:12px; font-size:0.95rem; font-weight:bold; border:1px solid rgba(255,255,255,0.4); border-radius:12px; color:#F4F6FB; text-decoration:none; box-sizing:border-box;">🧪 Probar la Demo</a>
  </div>
</div>

<iframe id="appFrame" style="display:none;"></iframe>

<a href="#" id="btnCambiarEscuela" onclick="cambiarEscuela(); return false;" title="Cambiar de escuela">⇄</a>

<script>
  // ⚠️ Reemplaza esto por la URL /exec real de tu proyecto "Directorio-GestionaPro" una vez
  // lo despliegues (Implementar -> Nueva implementación -> Aplicación web).
  var DIRECTORIO_URL = 'https://script.google.com/macros/s/AKfycbxDRAvJa6nmC2xgWklhMRIiI1gxRUc5vh9dSlz7eoWTzOZeJpkBJcka9ssnp_9-aJ8Wog/exec';

  var CLAVE_CODIGO = 'gp_codigo';
  var CLAVE_URL = 'gp_url';

  function mostrarPantallaCodigo(mensajeError) {
    document.getElementById('cargando').style.display = 'none';
    document.getElementById('appFrame').style.display = 'none';
    document.getElementById('btnCambiarEscuela').style.display = 'none';
    document.getElementById('pantallaCodigo').style.display = 'flex';
    document.getElementById('errorCodigo').innerText = mensajeError || '';
    document.getElementById('inputCodigo').focus();
  }

  function cargarApp(url) {
    var frame = document.getElementById('appFrame');
    frame.onload = function () {
      document.getElementById('cargando').style.display = 'none';
    };
    frame.src = url;
    frame.style.display = 'block';
    document.getElementById('pantallaCodigo').style.display = 'none';
  }

  function validarCodigo(codigo, esSilencioso) {
    fetch(DIRECTORIO_URL + '?codigo=' + encodeURIComponent(codigo), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok && data.url) {
          localStorage.setItem(CLAVE_CODIGO, codigo);
          localStorage.setItem(CLAVE_URL, data.url);
          cargarApp(data.url);
        } else {
          localStorage.removeItem(CLAVE_CODIGO);
          localStorage.removeItem(CLAVE_URL);
          mostrarPantallaCodigo(data.mensaje || 'Código no válido.');
        }
      })
      .catch(function () {
        if (esSilencioso) {
          // Sin internet o el Directorio no respondió: si ya había una URL guardada,
          // deja entrar con esa mientras se recupera la conexión, en vez de trabar al usuario.
          var urlGuardada = localStorage.getItem(CLAVE_URL);
          if (urlGuardada) { cargarApp(urlGuardada); return; }
        }
        mostrarPantallaCodigo('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
      });
  }

  function intentarEntrar() {
    var codigo = document.getElementById('inputCodigo').value.trim().toUpperCase();
    if (!codigo) {
      document.getElementById('errorCodigo').innerText = 'Escribe tu código de escuela.';
      return;
    }
    document.getElementById('btnEntrar').disabled = true;
    document.getElementById('errorCodigo').innerText = '';
    validarCodigo(codigo, false);
    document.getElementById('btnEntrar').disabled = false;
  }

  function cambiarEscuela() {
    // Confirmación para evitar salir por accidente al tocarlo sin querer
    // (antes era una franja de texto grande siempre visible; ahora es un
    // ícono pequeño, así que un toque accidental es menos probable, pero
    // igual conviene confirmar antes de cerrar la sesión de la escuela).
    if (!confirm('¿Salir de esta escuela y volver a pedir el código?')) return;
    localStorage.removeItem(CLAVE_CODIGO);
    localStorage.removeItem(CLAVE_URL);
    mostrarPantallaCodigo('');
  }

  document.getElementById('inputCodigo').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') intentarEntrar();
  });

  // Al cargar: si ya hay un código guardado en este dispositivo, revalida en segundo plano
  // (por si el administrador lo desactivó) y entra directo sin volver a preguntar.
  var codigoGuardado = localStorage.getItem(CLAVE_CODIGO);
  if (codigoGuardado) {
    validarCodigo(codigoGuardado, true);
  } else {
    mostrarPantallaCodigo('');
  }

  // Registro del service worker — requisito técnico para que esta página sea instalable
  // como PWA (paso previo a empaquetarla con Bubblewrap para Play Store).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* no bloquea la app */ });
    });
  }
</script>
